# CSJ Parkings · Prometheus (parking-mon)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    projecte: csj-parkings

rule_files:
  - /etc/prometheus/csj-alertes.yml

scrape_configs:
  # El mateix Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels: {host: parking-mon}

  # Sistema operatiu (CPU, memòria, disc, xarxa, RAID)
  - job_name: node
    static_configs:
      - targets: ['192.168.56.30:9100']
        labels: {host: parking-srv}
      - targets: ['localhost:9100']
        labels: {host: parking-mon}

  # Base de dades MariaDB
  - job_name: mysqld
    static_configs:
      - targets: ['192.168.56.30:9104']
        labels: {host: parking-srv}

  # La web respon per HTTPS amb un certificat vàlid (blackbox_exporter)
  - job_name: web_https
    metrics_path: /probe
    params:
      module: [http_csj]
    static_configs:
      - targets: ['https://csjparkings.local/']
        labels: {host: parking-srv}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115
